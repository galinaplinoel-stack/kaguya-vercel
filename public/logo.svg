<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
  <defs>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8a9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c5cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5caa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff5caa;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow-grad)" opacity="0.3"/>

  <!-- Crescent moon -->
  <path d="M 38 8 A 24 24 0 1 0 38 56 A 18 18 0 1 1 38 8 Z" fill="url(#moon-grad)" filter="url(#glow)"/>

  <!-- Small stars -->
  <circle cx="14" cy="18" r="1.5" fill="#e0e0ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="42" r="1" fill="#e0e0ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="32" r="0.8" fill="#ff5caa" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="10" r="0.7" fill="#5cffc7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle inner detail -->
  <circle cx="40" cy="22" r="2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="44" cy="34" r="1.5" fill="rgba(255,255,255,0.1)"/>
</svg>